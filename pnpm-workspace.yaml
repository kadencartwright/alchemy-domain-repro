  # Build them first with scripts/bootstrap-alchemy.sh (vendor/ is not committed).
  "alchemy": "file:./vendor/alchemy-main-de0bdeda2.tgz"
  "@alchemy.run/acme": "file:./vendor/alchemy.run-acme-main-de0bdeda2.tgz"
  "@alchemy.run/cloudflare": "file:./vendor/alchemy.run-cloudflare-main-de0bdeda2.tgz"
  "@alchemy.run/cloudflare-runtime": "file:./vendor/alchemy.run-cloudflare-runtime-main-de0bdeda2.tgz"
  "@alchemy.run/docker": "file:./vendor/alchemy.run-docker-main-de0bdeda2.tgz"
  "@alchemy.run/domain": "file:./vendor/alchemy.run-domain-main-de0bdeda2.tgz"
  "@alchemy.run/node-utils": "file:./vendor/alchemy.run-node-utils-main-de0bdeda2.tgz"
  "@alchemy.run/sql": "file:./vendor/alchemy.run-sql-main-de0bdeda2.tgz"
